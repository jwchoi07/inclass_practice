<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Operation</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root{ --g:#33ff66; --gd:#22b84a; --gdim:#145c27; --bg:#000; }
  *{box-sizing:border-box}
  html,body{background:#000}
  body{
    margin:0; color:var(--g); font-family:'VT323','Courier New',monospace; font-size:22px; line-height:1.3;
    text-shadow:0 0 4px rgba(51,255,102,.55);
  }
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:200;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.55) 100%);
  }
  .crt{max-width:980px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--gdim); border-right:1px solid var(--gdim); animation:flicker 6s infinite}
  @keyframes flicker{0%,97%,100%{opacity:1}98%{opacity:.85}99%{opacity:.95}}
  @keyframes blink{50%{opacity:0}}
  .inv{background:var(--g); color:#000; text-shadow:none; padding:0 6px}
  .dim{color:var(--gd)}
  .cursor::after{content:'_'; animation:blink 1s steps(1) infinite}

  /* ---------- BARS ---------- */
  .titlebar{background:var(--g); color:#000; text-shadow:none; padding:2px 10px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
  .status{border-bottom:1px solid var(--gdim); padding:6px 10px; display:flex; flex-wrap:wrap; gap:4px 22px; align-items:center}
  .st-step{color:var(--gdim); margin-right:4px}
  .st-step.done{color:var(--gd)}
  .st-step.active{background:var(--g); color:#000; text-shadow:none; padding:0 4px}
  .a{display:inline-block}
  .a.on{background:var(--g); color:#000; text-shadow:none; animation:blink .7s steps(1) infinite}
  main{flex:1; padding:16px 18px 40px}
  .fkeys{position:sticky; bottom:0; background:#000; border-top:1px solid var(--gdim); display:flex; gap:18px; padding:4px 10px; flex-wrap:wrap; z-index:30}
  .fkeys button{background:none; border:none; color:var(--g); font:inherit; cursor:pointer; text-shadow:inherit; padding:0}
  .fkeys button b{background:var(--g); color:#000; padding:0 4px; text-shadow:none; font-weight:normal}

  /* ---------- COMMON ---------- */
  pre.ascii{line-height:1.02; margin:4px 0 10px; font-size:19px; white-space:pre; overflow-x:auto}
  .mhead{margin:0 0 6px; font-size:30px; letter-spacing:1px}
  .obj{border-left:4px solid var(--g); padding:4px 0 4px 12px; margin:10px 0 12px}
  .obj .label{color:#000; background:var(--g); text-shadow:none; padding:0 6px; margin-right:6px}
  .warn{color:var(--gd)}
  .btn{background:#000; color:var(--g); border:1px solid var(--g); font:inherit; padding:2px 14px; cursor:pointer; text-shadow:inherit}
  .btn::before{content:'[ '} .btn::after{content:' ]'}
  .btn:hover,.btn:focus{background:var(--g); color:#000; text-shadow:none; outline:none}
  .btn.pulse{animation:pulse .8s steps(1) infinite}
  @keyframes pulse{50%{background:var(--g); color:#000; text-shadow:none}}
  .row{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:16px}
  .hint-btn{background:#000; color:var(--gd); border:1px dashed var(--gd); font:inherit; cursor:pointer; padding:0 10px; text-shadow:inherit}
  .hint-btn:hover{color:#000; background:var(--gd)}
  .hint-panel{display:none; margin-top:8px; border:1px dashed var(--g); padding:8px 12px; font-family:'D2Coding','NanumGothicCoding','Malgun Gothic',monospace; font-size:16px; line-height:1.7}
  .hint-panel.show{display:block}
  .flash main{animation:invert .25s steps(1) 2}
  @keyframes invert{50%{filter:invert(1)}}

  /* ---------- M1 ---------- */
  .passage{border:1px solid var(--gdim); padding:12px 14px; line-height:1.75; font-size:23px}
  .w{padding:0 2px; cursor:pointer}
  .w:hover{background:var(--g); color:#000; text-shadow:none}
  .tg.found .w{background:var(--gd); color:#000; text-shadow:none; cursor:default}
  .w.bad{text-decoration:line-through; color:var(--gdim)}
  .slots{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:4px 14px; margin-top:8px}
  .slot{color:var(--gdim)}
  .slot.open{color:var(--g)}

  /* ---------- M2: drag-to-connect ---------- */
  .match2{position:relative; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);
          column-gap:clamp(70px,14vw,170px); margin-top:14px; user-select:none; -webkit-user-select:none}
  .match2 .col{display:flex; flex-direction:column; gap:16px; position:relative; z-index:2}
  .match2 .colhead{color:var(--gd); margin-bottom:-6px}
  .wires{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; overflow:visible}
  .wire{fill:none; stroke:var(--g); stroke-width:3; filter:drop-shadow(0 0 4px var(--g))}
  .wire.live{stroke-dasharray:9 6; animation:dash .5s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-15}}
  .wire.bad{stroke-dasharray:4 5; animation:blink .15s steps(1) 4}
  .node{position:relative; border:1px solid var(--gdim); padding:8px 14px; background:#000; cursor:grab; touch-action:none; min-height:44px; display:flex; align-items:center}
  .node:hover{border-color:var(--g)}
  .node.phrase{font-size:25px}
  .node.def{font-size:21px; line-height:1.2}
  .node.sel{border-color:var(--g); background:#0a1f0f}
  .node.hover{background:var(--g); color:#000; text-shadow:none}
  .node.ok{border-color:var(--gd); color:var(--gd); cursor:default}
  .node.no{background:var(--g); color:#000; text-shadow:none; animation:blink .15s steps(1) 3}
  .port{position:absolute; top:50%; width:16px; height:16px; margin-top:-8px; border:2px solid var(--g); background:#000; border-radius:50%; box-shadow:0 0 6px var(--g)}
  .phrase .port{right:-9px}
  .def .port{left:-9px}
  .node.sel .port, .node.ok .port{background:var(--g)}
  .match2.dragging, .match2.dragging .node{cursor:grabbing}

  /* ---------- OPTIONS (M3) ---------- */
  .col{display:flex; flex-direction:column; gap:6px}
  .opt{display:block; width:100%; text-align:left; background:#000; color:var(--g); border:1px solid var(--gdim); font:inherit; padding:4px 10px; cursor:pointer; text-shadow:inherit}
  .opt:hover:not(:disabled){border-color:var(--g); background:#0a1f0f}
  .opt.sel{background:var(--g); color:#000; text-shadow:none}
  .opt.ok{border-color:var(--gd); color:var(--gd); cursor:default}
  .opt.ok::before{content:'✓ '}
  .opt.no{background:var(--g); color:#000; text-shadow:none; animation:blink .15s steps(1) 3}
  .opt.caught{background:var(--g); color:#000; text-shadow:none}
  .opt:disabled{cursor:default}
  .opts{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:6px}
  .scene{border:1px solid var(--gdim); padding:12px 14px; font-size:25px; margin-bottom:12px}
  .blank{display:inline-block; min-width:150px; border-bottom:2px solid var(--g); text-align:center; color:transparent; text-shadow:none}
  .blank.filled{color:#000; background:var(--g)}
  .explain{border:1px dashed var(--g); padding:8px 12px; margin-top:12px}

  /* ---------- M4 ---------- */
  .field{border:1px solid var(--gdim); padding:8px 12px; margin-bottom:10px}
  .field.passed{border-color:var(--g)}
  .prompt{display:flex; gap:8px; align-items:center; margin-top:4px}
  .prompt input{flex:1; background:#000; color:var(--g); border:none; border-bottom:1px dashed var(--g); font:inherit; padding:2px 4px; outline:none; caret-color:var(--g); text-shadow:inherit}
  .status-line{min-height:24px; color:var(--gd)}

  /* ---------- OVERLAY ---------- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center; z-index:80; padding:14px}
  .overlay.hidden{display:none}
  .doc{background:#000; border:2px solid var(--g); box-shadow:0 0 24px rgba(51,255,102,.3); max-width:640px; width:100%; max-height:92vh; overflow:auto; padding:16px 20px}
  .doc .line{margin:4px 0; min-height:26px; word-break:break-word}
  .doc .line.key{font-size:28px}
  .granted{display:none; text-align:center; margin-top:10px}
  .granted.show{display:block; animation:blink .2s steps(1) 4}
  .actions{margin-top:12px; text-align:right; visibility:hidden}
  .actions.show{visibility:visible}

  /* ---------- PASSWORD ---------- */
  .vault-wrap{display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start; justify-content:center; margin-top:6px}
  .term{border:1px solid var(--g); padding:12px 16px; width:320px}
  .pwscreen{font-size:40px; letter-spacing:6px; text-align:center; border:1px solid var(--gdim); margin:8px 0 12px; padding:4px}
  .pwscreen.deny{font-size:30px; letter-spacing:1px; background:var(--g); color:#000; text-shadow:none}
  .keys{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
  .key{background:#000; color:var(--g); border:1px solid var(--g); font:inherit; font-size:28px; padding:2px 0; cursor:pointer; text-shadow:inherit}
  .key:hover{background:var(--g); color:#000; text-shadow:none}
  .key.wide{font-size:20px}
  .notes{width:250px; border:1px dashed var(--g); padding:6px 12px 12px; transform:rotate(3deg)}
  .notes .nh{background:var(--g); color:#000; text-shadow:none; padding:0 6px; margin:-6px -12px 8px}
  .notes .hand{font-family:'Caveat',cursive; font-size:24px; line-height:1.1}
  .notes .code{font-family:'Caveat',cursive; font-size:70px; letter-spacing:8px; line-height:1; margin:8px 0}

  /* ---------- ENDING ---------- */
  .recap{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:6px; margin-top:8px}
  .recap div{border:1px solid var(--gdim); padding:6px 10px; font-size:20px}
  .recap .ko{font-family:'D2Coding','Malgun Gothic',monospace; font-size:14px; color:var(--gd)}
  .typed div{min-height:26px}

  /* ---------- CODEC (radio call) ---------- */
  .codec{display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:stretch; border:2px solid var(--g); padding:12px; margin-top:12px;
         background:#010a03; box-shadow:inset 0 0 40px rgba(51,255,102,.15), 0 0 18px rgba(51,255,102,.2)}
  .pf{border:2px solid var(--g); padding:10px 6px 4px; text-align:center; position:relative; overflow:hidden; transition:opacity .25s; background:#000}
  .pf pre{margin:0; font-size:19px; line-height:1.0; white-space:pre; display:inline-block; text-align:left; min-height:192px}
  .pf::after{content:''; position:absolute; inset:0; pointer-events:none;
             background:repeating-linear-gradient(0deg, rgba(51,255,102,.07) 0 2px, transparent 2px 5px); animation:roll 3s linear infinite}
  @keyframes roll{to{background-position:0 50px}}
  .pf.idle{opacity:.35}
  .pname{border-top:1px solid var(--gdim); margin-top:4px; letter-spacing:2px}
  .freq{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-width:170px}
  .call{background:var(--g); color:#000; text-shadow:none; padding:0 12px; font-size:26px; visibility:hidden}
  .call.ring{visibility:visible; animation:blink .4s steps(1) infinite}
  .tag{border:1px solid var(--g); padding:0 10px; font-size:18px; letter-spacing:2px}
  .meter{display:flex; gap:3px; align-items:flex-end; height:50px}
  .meter i{width:9px; height:4px; background:var(--g); box-shadow:0 0 6px var(--g); transition:height .08s}
  .fnum{font-size:42px; letter-spacing:2px; line-height:1}
  .ctext{border:2px solid var(--g); margin-top:10px; padding:8px 14px 22px; min-height:104px; cursor:pointer; position:relative; background:#010a03}
  .who{display:inline-block; color:#000; background:var(--g); text-shadow:none; padding:0 8px; margin-bottom:4px; min-height:24px}
  .say{font-size:26px; line-height:1.3}
  .say b{background:var(--gd); color:#000; text-shadow:none; padding:0 4px; font-weight:normal}
  .cnext{position:absolute; right:10px; bottom:2px; font-size:17px; display:none; animation:blink 1s steps(1) infinite}
  .cnext.show{display:block}

  /* ---------- TOAST ---------- */
  .toast{position:fixed; left:50%; bottom:44px; transform:translate(-50%,200px); background:#000; border:1px solid var(--g); padding:6px 14px; max-width:92vw; z-index:90; transition:transform .25s}
  .toast.show{transform:translate(-50%,0)}
  .toast.bad{background:var(--g); color:#000; text-shadow:none}

  /* ---------- DEBUG ---------- */
  .debug{position:fixed; right:10px; top:70px; width:290px; background:#000; border:1px dashed var(--g); padding:8px 10px; z-index:120; font-size:19px; display:none}
  .debug.show{display:block}
  .debug .dh{background:var(--g); color:#000; text-shadow:none; padding:0 6px; margin:-8px -10px 6px; display:flex; justify-content:space-between}
  .debug .dh button{background:none; border:none; font:inherit; cursor:pointer}
  .debug .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:4px 0 8px}
  .debug button.d{background:#000; color:var(--g); border:1px solid var(--gdim); font:inherit; font-size:17px; cursor:pointer; padding:1px 2px}
  .debug button.d:hover{border-color:var(--g)}
  .debug button.d.on{background:var(--g); color:#000}
  .debug .full{width:100%; margin-top:4px}
  .debug .info{border-top:1px dashed var(--gdim); margin-top:6px; padding-top:4px; font-size:17px}
  .dbgtag{display:none; color:#000; background:var(--gd); text-shadow:none; padding:0 4px; font-size:16px; margin-left:6px}
  .dbg-ans .dbgtag{display:inline}
  .dbg-ans .tg, .dbg-ans .ans{outline:1px dashed var(--g); outline-offset:2px}

  @media (max-width:640px){
    body{font-size:20px}
    pre.ascii{font-size:13px}
    .scene{font-size:21px}
    .node.phrase{font-size:20px}
    .node.def{font-size:16px}
    .node{padding:6px 10px}
    .debug{left:8px; right:8px; width:auto; top:auto; bottom:44px}
    .codec{grid-template-columns:1fr 1fr; gap:8px}
    .freq{grid-column:1 / -1; order:-1; flex-direction:row; flex-wrap:wrap; gap:10px; min-width:0}
    .pf pre{font-size:12px; min-height:122px}
    .fnum{font-size:32px}
    .say{font-size:22px}
  }
</style>
</head>
<body>
<div class="crt">
  <div class="titlebar"><span>C:\SECRETOP\HACK.EXE</span><span>TARGET: B.O.R.E.D. MAINFRAME</span></div>
  <div class="status">
    <span id="steps"></span>
    <span>ALARM <span id="alarm"></span> <span class="dim" id="left"></span></span>
    <span>PASSWORD <span id="memo">_ _ _ _</span></span>
  </div>
  <main id="app"></main>
  <div class="fkeys">
    <button id="fHint"><b>F1</b> HINT</button>
    <button id="fDebug"><b>F9</b> DEBUG</button>
    <span class="dim" style="margin-left:auto">SECRET OPERATION v1.3</span>
  </div>
</div>

<div id="overlay" class="overlay hidden"></div>
<div id="toast" class="toast"></div>

<div class="debug" id="debug">
  <div class="dh"><span>DEBUG MODE</span><button id="dbgClose">[X]</button></div>
  <div>JUMP TO:</div>
  <div class="grid">
    <button class="d" data-go="0">BOOT</button><button class="d" data-go="1">M1</button>
    <button class="d" data-go="2">M2</button><button class="d" data-go="3">M3</button>
    <button class="d" data-go="4">M4</button><button class="d" data-go="5">PWD</button>
    <button class="d" data-go="6">END</button><button class="d" data-act="restart">NEW</button>
  </div>
  <button class="d full" data-act="answers" id="dbgAns">SHOW ANSWERS: OFF</button>
  <button class="d full" data-act="clear">CLEAR CURRENT MISSION</button>
  <button class="d full" data-act="fill">AUTO-FILL M4 SENTENCES</button>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <button class="d" data-act="strike">+1 ALARM</button>
    <button class="d" data-act="reset">RESET ALARM</button>
  </div>
  <button class="d full" data-act="code">NEW PASSWORD</button>
  <div class="info" id="dbgInfo"></div>
</div>

<script>
/* =========================================================
   DATA
   ========================================================= */
const EX = [
  {id:'charge', p:'in charge of',      d:'to be the person who manages or controls something',   ko:'~을 담당하는, 책임지는'},
  {id:'part',   p:'take part in',      d:'to join an activity or event',                          ko:'~에 참여하다'},
  {id:'figure', p:'figure out',        d:'to find an answer or understand something',             ko:'알아내다, 이해하다'},
  {id:'work',   p:'work on',           d:'to spend time making or improving something',           ko:'~에 공을 들이다, ~을 작업하다'},
  {id:'cut',    p:'cut down on',       d:'to use, eat, or do less of something',                  ko:'~을 줄이다'},
  {id:'diff',   p:'make a difference', d:'to have a good effect; to change things in a good way', ko:'변화를 가져오다, 효과가 있다'}
];
const byId = Object.fromEntries(EX.map(e => [e.id, e]));

const PASSAGE = [
  "Our class is preparing for the school festival. Mina is ", {id:'charge'},
  " the English booth. She asked everyone to ", {id:'part'},
  " a short quiz game. At first, the team could not ", {id:'figure'},
  " how to make the activity interesting. They decided to ", {id:'work'},
  " a mystery theme. After testing the game, they decided to ", {id:'cut'},
  " long instructions. They hope these changes will ", {id:'diff'},
  " for the students who visit the booth."
];

const FIELD = [
  {id:'charge', tag:'SNACK BOOTH', s:'Jisu is ___ the snack booth. She decides the menu and the prices.'},
  {id:'part',   tag:'DANCE STAGE', s:'Over 50 students want to ___ the dance contest this year.'},
  {id:'figure', tag:'QUIZ ROOM',   s:'This quiz is really hard. Can you help me ___ the answer?'},
  {id:'work',   tag:'ART ROOM',    s:'Our team will ___ the festival poster all afternoon.'},
  {id:'cut',    tag:'CAFETERIA',   s:'We need to ___ paper cups. They make too much trash.'},
  {id:'diff',   tag:'MAIN GATE',   s:'Even a small smile can ___ for a nervous visitor.'}
];

const SAB = [
  {list:[
    {t:'Mina is in charge of the English booth.'},
    {t:'We want to take part on the quiz game.', bad:true},
    {t:'They are working on a new poster.'}],
   exp:'ERROR: "take part ON" → FIX: "take part IN". The small word matters!'},
  {list:[
    {t:'I finally figured out the secret code.'},
    {t:'We should cut down on fun games because everyone loves them.', bad:true},
    {t:'Short instructions can make a difference.'}],
   exp:'ERROR: "cut down on" = use or do LESS. We don\'t want less of something everyone loves!'},
  {list:[
    {t:'Who is in charge of the music?'},
    {t:'Many students took part in the festival.'},
    {t:'This long speech will make a difference because nobody will listen.', bad:true}],
   exp:'ERROR: "make a difference" = have a GOOD effect. If nobody listens, it does NOT make a difference.'},
  {list:[
    {t:'Can you figure up this puzzle?', bad:true},
    {t:'Mina is working on the quiz questions.'},
    {t:'Let\'s cut down on long instructions.'}],
   exp:'ERROR: "figure UP" → FIX: "figure OUT".'}
];

const PROMPTS = {
  charge:{q:'What job do you want at the festival?',         ex:'I want to be in charge of the music.'},
  part:  {q:'What festival event will you join?',            ex:'I will take part in the singing contest.'},
  figure:{q:'What is hard for you to understand or solve?',  ex:'I can\'t figure out math problems quickly.'},
  work:  {q:'What are you making or practicing these days?', ex:'I am working on my English project.'},
  cut:   {q:'What do you want to use, eat, or do less?',     ex:'I want to cut down on snacks.'},
  diff:  {q:'What small action can help other people?',      ex:'Picking up trash can make a difference.'}
};

const RX = {
  charge:/\bin charge of\b/,
  part:  /\b(take|takes|took|taking|taken) part in\b/,
  figure:/\b(figure|figures|figured|figuring)( [a-z']+){0,2} out\b/,
  work:  /\b(work|works|worked|working) on\b/,
  cut:   /\b(cut|cuts|cutting) down on\b/,
  diff:  /\b(make|makes|made|making) (a |an |no |some )?([a-z]+ )?difference\b/
};

const KO_ALL = EX.map(e => `<b>${e.p}</b> : ${e.ko}`).join('<br>');

/* radio call scripts: [speaker, line]  A = Agent 8, M = Handler M */
const INTRO_CALL = [
  ['M', 'Agent 8, this is Handler M. Do you read me?'],
  ['A', 'Loud and clear, M. What\'s the situation?'],
  ['M', 'The school festival is in danger.'],
  ['M', 'A secret group wants to make it boring with super long instructions.'],
  ['A', 'Who are they?'],
  ['M', 'B.O.R.E.D. The Bureau Of Really Endless Directions.'],
  ['M', 'They are everywhere. Even the principal\'s plant may be watching us.'],
  ['A', '...The plant?'],
  ['M', 'Focus, Agent. Your job is to hack their mainframe.'],
  ['M', 'Clear 4 missions and collect 4 password numbers.'],
  ['M', 'But be careful. 3 mistakes, and the alarm goes off.'],
  ['A', 'Got it. I\'m ready.'],
  ['M', 'Good luck, Agent 8. Over.']
];

const ENDING_CALL = [
  ['M', 'Agent 8, can you hear me? This is Handler M.'],
  ['A', 'Loud and clear, M. I\'m inside the mainframe.'],
  ['M', 'Great job. You <b>figured out</b> the password.'],
  ['A', 'Wait... this secret file is empty. Where is the secret?'],
  ['M', 'YOU are the secret. The quiz booth was a test to find new agents.'],
  ['M', 'I was <b>in charge of</b> it from the start.'],
  ['A', 'So I didn\'t just <b>take part in</b> a game...?'],
  ['M', 'No. You <b>worked on</b> a real mission. And B.O.R.E.D. is finished.'],
  ['M', 'We <b>cut down on</b> their long instructions... forever.'],

const S = {stage:0, strikes:0, total:0, stageM:0, code:[], got:0, locked:false, picks:[], keyH:null, run:0, debug:false, answers:false, cleanup:[]};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

let actx = null;
function beep(f, d = .08, type = 'square') {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = .04;
    o.connect(g); g.connect(actx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d); o.stop(actx.currentTime + d);
  } catch (e) {}
}

let toastTimer = null;
function toast(msg, type = '') {
  const t = $('#toast');
  t.innerHTML = '&gt; ' + msg; t.className = 'toast show ' + type;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast ' + type, 2400);
}

function updateHUD() {

    return `<span class="st-step ${c}">${S.stage > s ? '✓' : ''}${n}</span>`;
  }).join('');
  $('#alarm').innerHTML = [0, 1, 2].map(i => `<span class="a ${i < S.strikes ? 'on' : ''}">[${i < S.strikes ? '!' : ' '}]</span>`).join('');
  $('#left').textContent = `(${3 - S.strikes} left)`;

function strike(msg) {
  if (S.locked) return;

  beep(120, .3, 'sawtooth');

    setTimeout(gameOver, 900);
  } else {

/* typed lines (click to skip) */
function typeLines(el, lines, speed, done) {
  const tok = S.run; let i = 0, fast = false;
  el.onclick = () => fast = true;
  (function next() {
    if (tok !== S.run) return;
    if (i >= lines.length) { el.onclick = null; done && done(); return; }
    const d = document.createElement('div'); d.innerHTML = lines[i] || '&nbsp;'; el.appendChild(d); i++;
    if (!fast) beep(900, .015);
    setTimeout(next, fast ? 0 : speed);
  })();
}

/* decrypt effect: ████ → random chars → real text */
function decrypt(el, html, ms, done) {
  const tok = S.run;
  const tmp = document.createElement('div'); tmp.innerHTML = html;
  const plain = tmp.textContent, chars = '█▓▒░#$%&@*01<>/';
  const steps = 9; let t = 0;
  const iv = setInterval(() => {
    if (tok !== S.run) { clearInterval(iv); return; }
    t++;
    const ratio = t / steps;
    el.textContent = plain.split('').map((c, i) => c === ' ' ? ' ' : (i / plain.length < ratio ? c : chars[Math.random() * chars.length | 0])).join('');
    if (t >= steps) { clearInterval(iv); el.innerHTML = html; done && done(); }
  }, ms / steps);
}

function runCodec(slot, script, onEnd) {
  slot.innerHTML = codecHTML();
  const tok = S.run, alive = () => tok === S.run;
  const faceA = $('#faceA'), faceM = $('#faceM'), pfA = $('#pfA'), pfM = $('#pfM');
  const who = $('#who'), say = $('#say'), cnext = $('#cnext'), call = $('#call');
  const bars = $$('#meter i');
  let idx = 0, typing = false, answered = false, done = false;
  let typeT = null, mouthT = null, meterT = null, finishFn = null;

  const noise = () => Array.from({length:10}, () => Array.from({length:21}, () => '░▒▓  '[Math.random() * 5 | 0]).join('')).join('\n');
  const drawFace = (side, open) => {
    const f = FACES[side];
    (side === 'A' ? faceA : faceM).textContent = f.lines.map((l, i) => i === f.mouth && open ? f.open : l).join('\n');
  };
  const setMeter = on => bars.forEach((b, i) => b.style.height = on ? (6 + Math.random() * 44 * (1 - i / 14)) + 'px' : '4px');
  const stopAll = () => { clearInterval(typeT); clearInterval(mouthT); clearInterval(meterT); };

  faceA.textContent = noise(); faceM.textContent = noise();
  call.classList.add('ring');
  const idleT = setInterval(() => { if (!alive() || answered) return clearInterval(idleT); faceA.textContent = noise(); faceM.textContent = noise(); }, 160);
  const ring = () => { if (!alive() || answered) return; beep(1200, .1); setTimeout(() => beep(900, .1), 130); };
  ring();
  const ringT = setInterval(() => { if (!alive() || answered) return clearInterval(ringT); ring(); }, 1300);
  slot.scrollIntoView({behavior:'smooth', block:'start'});
  $('#answer').focus({preventScroll:true});

  function answer() {
    if (answered) return;
    answered = true;
    clearInterval(ringT); clearInterval(idleT);
    call.classList.remove('ring');
    $('#answer').style.display = 'none'; $('#skip').style.display = '';
    who.textContent = ''; say.textContent = 'CONNECTING...';
    beep(1500, .05);
    let n = 0;
    const st = setInterval(() => {
      if (!alive()) return clearInterval(st);
      faceA.textContent = noise(); faceM.textContent = noise(); beep(200 + Math.random() * 300, .02, 'sawtooth');
      if (++n > 7) { clearInterval(st); drawFace('A', false); drawFace('M', false); showLine(); }
    }, 70);
  }

  function showLine() {
    if (!alive()) return;
    if (idx >= script.length) return endCall();
    const [sp, html] = script[idx];
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    const plain = tmp.textContent;
    who.textContent = sp === 'M' ? 'HANDLER M' : 'AGENT 8';
    pfM.classList.toggle('idle', sp !== 'M'); pfA.classList.toggle('idle', sp !== 'A');
    $('#cprog').textContent = `${idx + 1} / ${script.length}`;
    cnext.classList.remove('show');
    let c = 0, open = false; typing = true;
    stopAll();
    mouthT = setInterval(() => { open = !open; drawFace(sp, open); }, 120);
    meterT = setInterval(() => setMeter(true), 90);
    typeT = setInterval(() => {
      if (!alive()) return stopAll();
      c++; say.textContent = plain.slice(0, c);
      if (c % 2) beep(sp === 'M' ? 640 : 480, .02);
      if (c >= plain.length) finishFn();
    }, 30);
    finishFn = () => {
      stopAll(); typing = false;
      say.innerHTML = html; drawFace(sp, false); setMeter(false);
      cnext.classList.add('show');
    };
  }

  function advance() {
    if (!answered) { answer(); return; }
    if (done) return;
    if (typing) { finishFn(); return; }
    idx++; showLine();
  }

  function endCall() {
    if (done) return;
    done = true; stopAll(); clearKeys();
    who.textContent = ''; cnext.classList.remove('show');
    say.textContent = '... SIGNAL LOST ...';
    pfA.classList.remove('idle'); pfM.classList.remove('idle');
    setMeter(false);
    $('#skip').style.display = 'none';
    let n = 0;
    const st = setInterval(() => {
      if (!alive()) return clearInterval(st);
      faceA.textContent = noise(); faceM.textContent = noise(); beep(200 + Math.random() * 200, .02, 'sawtooth');
      if (++n > 10) { clearInterval(st); onEnd && onEnd(); }
    }, 80);
  }

  $('#answer').onclick = answer;
  $('#ctext').onclick = advance;
  $('#skip').onclick = () => { if (!answered) answered = true; endCall(); };
  clearKeys();
  S.keyH = ev => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); advance(); }
  };
  document.addEventListener('keydown', S.keyH);
}

  app.innerHTML = `

      `지문 속에 <b>두세 단어가 모여 하나의 뜻</b>을 만드는 표현 6개가 숨어 있어요.<br>

  let found = 0;
  $('#passage').onclick = ev => {
    if (S.locked) return;
    const w = ev.target.closest('.w'); if (!w) return;
    const tg = w.closest('.tg');
    if (tg) {
      if (tg.classList.contains('found')) return;

      const slot = $(`.slot[data-id="${tg.dataset.id}"]`);

      <div class="col">
        <div class="colhead">EXPRESSIONS</div>
        ${L.map(e => `<div class="node phrase" data-side="L" data-id="${e.id}"><span>${e.p}<span class="dbgtag">#${num(e.id)}</span></span><i class="port"></i></div>`).join('')}
      </div>
      <div class="col">
        <div class="colhead">MEANINGS (encrypted)</div>
        ${R.map(e => `<div class="node def" data-side="R" data-id="${e.id}"><span>${e.d}<span class="dbgtag">#${num(e.id)}</span></span><i class="port"></i></div>`).join('')}
      </div>
    </div>
    <div style="margin-top:14px">CONNECTED: <span class="inv" id="mcount">0 / 6</span></div>`;

  const box = $('#match2'), svg = $('#wires');
  const links = [];
  let drag = null, armed = null, matched = 0;

  const portXY = el => {
    const p = el.querySelector('.port').getBoundingClientRect(), b = box.getBoundingClientRect();
    return {x:p.left + p.width / 2 - b.left, y:p.top + p.height / 2 - b.top};
  };
  const curve = (a, b) => {
    const s = a.x <= b.x ? 1 : -1, dx = Math.max(40, Math.abs(b.x - a.x) / 2);
    return `M${a.x},${a.y} C${a.x + dx * s},${a.y} ${b.x - dx * s},${b.y} ${b.x},${b.y}`;
  };
  const mkPath = cls => { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('class', 'wire ' + cls); svg.appendChild(p); return p; };
  const redraw = () => links.forEach(k => k.path.setAttribute('d', curve(portXY(k.l), portXY(k.r))));
  const nodeAt = (x, y) => { const el = document.elementFromPoint(x, y); return el ? el.closest('.match2 .node') : null; };
  const clearHover = () => $$('.node.hover', box).forEach(n => n.classList.remove('hover'));
  const disarm = () => { if (armed) armed.classList.remove('sel'); armed = null; };

  function tryLink(a, b) {
    const l = a.dataset.side === 'L' ? a : b, r = l === a ? b : a;
    l.classList.remove('sel'); r.classList.remove('sel');
    if (l.dataset.id === r.dataset.id) {
      const path = mkPath('ok');
      path.setAttribute('d', curve(portXY(l), portXY(r)));
      links.push({l, r, path});
      l.classList.add('ok'); r.classList.add('ok');
      matched++; $('#mcount').textContent = `${matched} / 6`;
      beep(720, .1);
      if (matched === 6) setTimeout(() => complete(2), 600);
    } else {
      const path = mkPath('bad');
      path.setAttribute('d', curve(portXY(l), portXY(r)));
      setTimeout(() => path.remove(), 650);
      [l, r].forEach(n => { n.classList.add('no'); setTimeout(() => n.classList.remove('no'), 600); });
      strike('Wrong connection. Read again!');
    }
  }

  listen(box, 'pointerdown', ev => {
    if (S.locked) return;
    const n = ev.target.closest('.node');
    if (!n || n.classList.contains('ok')) return;
    ev.preventDefault();
    if (armed) {
      if (armed === n) { disarm(); return; }
      if (armed.dataset.side !== n.dataset.side) { const a = armed; disarm(); tryLink(a, n); return; }
      disarm();
    }
    n.classList.add('sel');
    box.classList.add('dragging');
    drag = {from:n, path:mkPath('live'), sx:ev.clientX, sy:ev.clientY, moved:false};
    beep(440, .04);
  });

  listen(document, 'pointermove', ev => {
    if (!drag) return;
    if (Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) > 6) drag.moved = true;
    const b = box.getBoundingClientRect();
    drag.path.setAttribute('d', curve(portXY(drag.from), {x:ev.clientX - b.left, y:ev.clientY - b.top}));
    clearHover();
    const t = nodeAt(ev.clientX, ev.clientY);
    if (t && t.dataset.side !== drag.from.dataset.side && !t.classList.contains('ok')) t.classList.add('hover');
  });

  const endDrag = ev => {
    if (!drag) return;
    const d = drag; drag = null;
    d.path.remove(); clearHover(); box.classList.remove('dragging');
    const t = ev.type === 'pointercancel' ? null : nodeAt(ev.clientX, ev.clientY);
    if (t && t !== d.from && t.dataset.side !== d.from.dataset.side && !t.classList.contains('ok')) {
      tryLink(d.from, t);
    } else if (!d.moved) {
      armed = d.from;            // simple click → keep selected, click the other side next
    } else {
      d.from.classList.remove('sel');
    }
  };
  listen(document, 'pointerup', endDrag);
  listen(document, 'pointercancel', endDrag);
  listen(window, 'resize', redraw);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
}

/* =========================================================
   3. FIREWALL (fill-in + corrupted line)
   ========================================================= */
function stage3() {
  const items = shuffle(FIELD).slice(0, 4);
  const sabs = shuffle(SAB).slice(0, 2);
  const hint3 = KO_ALL + `<br><br>⚠ 작은 단어(<b>in, out, on</b>)와 문장의 <b>의미</b>가 맞는지 꼭 확인하세요!`;
  let i = 0;

  function renderA() {
    const it = items[i], parts = it.s.split('___');
    app.innerHTML = `
      ${head('MISSION 3', 'FIREWALL',
        `<b>Part A.</b> Fill in the blank with the best expression.`, hint3, '[!] Wrong choice = 1 alarm.')}
      <div style="margin:12px 0 6px">FIREWALL CHECK <span class="inv">${i + 1} / ${items.length}</span> &nbsp;<span class="dim">LOCATION: ${it.tag}</span></div>
      <div class="scene">&gt; ${parts[0]}<span class="blank" id="blank">${byId[it.id].p}</span>${parts[1]}</div>
      <div class="opts">${shuffle(EX).map(e => `<button class="opt ${e.id === it.id ? 'ans' : ''}" data-id="${e.id}">${e.p}</button>`).join('')}</div>`;
    $$('.opts .opt').forEach(b => b.onclick = () => {
      if (S.locked || b.disabled) return;
      if (b.dataset.id === it.id) {
        $('#blank').classList.add('filled'); b.classList.add('ok');
        $$('.opts .opt').forEach(x => x.disabled = true); beep(720, .1);
        setTimeout(() => { i++; if (i < items.length) renderA(); else { i = 0; renderB(); } }, 900);
      } else {
        b.classList.add('no'); b.disabled = true;
        strike('That expression does not fit here.');
      }
    });
  }

  function renderB() {
    const sb = sabs[i];
    app.innerHTML = `
      ${head('MISSION 3', 'FIREWALL',
        `<b>Part B.</b> B.O.R.E.D. corrupted <b>ONE</b> sentence. It is wrong in <b>grammar</b> or <b>meaning</b>. Click it!`,
        hint3, '[!] Clicking a correct sentence = 1 alarm.')}
      <div style="margin:12px 0 6px">CORRUPTION SCAN <span class="inv">${i + 1} / ${sabs.length}</span></div>
      <div class="col sab">${shuffle(sb.list).map(o => `<button class="opt ${o.bad ? 'ans' : ''}" data-bad="${o.bad ? 1 : 0}">&gt; ${o.t}</button>`).join('')}</div>
      <div id="exp"></div>`;
    $$('.sab .opt').forEach(b => b.onclick = () => {
      if (S.locked || b.disabled) return;
      if (b.dataset.bad === '1') {
        b.classList.add('caught'); b.innerHTML = '[CORRUPTED] ' + b.innerHTML;
        $$('.sab .opt').forEach(x => x.disabled = true); beep(720, .1);
        $('#exp').innerHTML = `<div class="explain">${sb.exp}</div>
          <div class="row"><span></span><button class="btn" id="cont">CONTINUE</button></div>`;
        $('#cont').focus();
        $('#cont').onclick = () => { i++; if (i < sabs.length) renderB(); else complete(3); };
      } else {
        b.classList.add('ok'); b.disabled = true;
        strike('That sentence is correct. Look again!');
      }
    });
  }
  renderA();
}

/* =========================================================
   4. UPLOAD (writing, usage check only)
   ========================================================= */
function stage4() {
  S.picks = shuffle(EX).slice(0, 3);
  app.innerHTML = `
    ${head('MISSION 4', 'UPLOAD',
      `Write <b>one sentence about YOU</b> with each expression (<b>4+ words</b>). Then press UPLOAD.`,
      S.picks.map(e => `<b>${e.p}</b> (${e.ko})<br>예시: <i>${PROMPTS[e.id].ex}</i>`).join('<br><br>'),
      '[!] Missing expression or too short = 1 alarm.')}
    <div style="margin-top:12px">
    ${S.picks.map((e, k) => `
      <div class="field" data-id="${e.id}">
        <div>REPORT ${k + 1} · use <span class="inv">${e.p}</span></div>
        <div class="dim">Q. ${PROMPTS[e.id].q}<span class="dbgtag">${PROMPTS[e.id].ex}</span></div>
        <div class="prompt"><span>C:\\REPORT&gt;</span><input type="text" maxlength="140" autocomplete="off" spellcheck="false" placeholder="type your sentence here"></div>
        <div class="status-line"></div>
      </div>`).join('')}
    </div>
    <div class="row"><span class="dim">B.O.R.E.D. is watching the upload line. Hurry!</span><button class="btn" id="send">UPLOAD</button></div>`;

  const norm = v => v.toLowerCase().replace(/[’]/g, "'").replace(/[^a-z' ]/g, ' ').replace(/\s+/g, ' ').trim();
  $('#send').onclick = () => {
    if (S.locked) return;
    const fields = $$('.field');
    if (fields.some(f => !$('input', f).value.trim())) { toast('Write all 3 sentences first, Agent.'); return; }
    let fails = 0;
    fields.forEach(f => {
      const e = byId[f.dataset.id], v = norm($('input', f).value), st = $('.status-line', f);
      const words = v.split(' ').filter(Boolean).length;
      if (!RX[e.id].test(v)) { fails++; f.classList.remove('passed'); st.textContent = `[X] Can't find "${e.p}" in your sentence.`; }
      else if (words < 4)    { fails++; f.classList.remove('passed'); st.textContent = '[X] Too short. Write at least 4 words.'; }
      else                   { f.classList.add('passed'); st.textContent = '[OK] Expression confirmed.'; }
    });
    if (fails) strike(`${fails} sentence(s) need fixing.`);
    else { beep(720, .15); setTimeout(() => complete(4), 600); }
  };
}

/* =========================================================
   5. LOGIN (password keypad)
   ========================================================= */
function vault() {
  S.got = 4;
  let entry = '', opened = false;
  const code = S.code.join('');
  app.innerHTML = `
    ${head('FINAL', 'LOGIN', `Type the <b>4-digit password</b> from your NOTES.TXT. (You can also use your keyboard.)`)}
    <div class="vault-wrap">
      <div class="term">
        <pre class="ascii" id="lockArt" style="text-align:center">${ART_LOCK}</pre>
        <div>B.O.R.E.D. MAINFRAME LOGIN</div>
        <div class="pwscreen" id="screen">_ _ _ _</div>
        <div class="keys">
          ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="key" data-k="${n}">${n}</button>`).join('')}
          <button class="key wide" data-k="C">CLR</button>
          <button class="key" data-k="0">0</button>
          <button class="key wide" data-k="E">ENTER</button>
        </div>
      </div>
      <div class="notes">
        <div class="nh">NOTES.TXT</div>
        <div class="hand">mainframe password!!<br>(don't forget)</div>
        <div class="code">${code}</div>
        <div class="hand">— trust no plants</div>
      </div>
    </div>`;

  const screen = $('#screen');
  const show = () => { screen.textContent = (entry + '____').slice(0, 4).split('').join(' '); };
  function press(k) {
    if (opened || screen.classList.contains('deny')) return;
    if (/^[0-9]$/.test(k)) { if (entry.length < 4) { entry += k; beep(500 + Number(k) * 40, .06); show(); } }
    else if (k === 'C') { entry = ''; beep(250, .06); show(); }
    else if (k === 'E') {
      if (entry.length < 4) { toast('Enter 4 numbers.'); return; }
      if (entry === code) {
        opened = true; screen.textContent = 'OK'; $('#lockArt').textContent = ART_UNLOCK;
        [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .12, 'triangle'), i * 140));
        setTimeout(() => go(6), 1600);
      } else {
        screen.classList.add('deny'); screen.textContent = 'ACCESS DENIED';
        beep(110, .35, 'sawtooth');
        setTimeout(() => { entry = ''; screen.classList.remove('deny'); show(); }, 900);
      }
    }
  }
  $$('.key').forEach(b => b.onclick = () => press(b.dataset.k));
  S.keyH = ev => {
    if (/^[0-9]$/.test(ev.key)) press(ev.key);
    else if (ev.key === 'Enter') press('E');
    else if (ev.key === 'Backspace' || ev.key === 'Escape') press('C');
  };
  document.addEventListener('keydown', S.keyH);
}

/* =========================================================
   6. ENDING CALL
   ========================================================= */
function ending() {
  const t = S.total;
  const [rank, msg] =
    t === 0 ? ['ELITE HACKER', 'A perfect hack. B.O.R.E.D. is shaking.'] :
    t <= 3  ? ['SENIOR AGENT', 'Excellent work. Only a few alarms.'] :
    t <= 6  ? ['FIELD AGENT',  'Good job! Keep training, Agent.'] :
              ['ROOKIE AGENT', 'You made it! Every agent starts somewhere.'];

  app.innerHTML = `
    <pre class="ascii">${ART_GRANTED}</pre>
    <div class="typed" id="typed"></div>
    <div id="codecSlot"></div>
    <div id="after" style="display:none">
      <pre class="ascii">${ART_BADGE}</pre>
      <div>RANK: <span class="inv">${rank}</span> &nbsp; ${msg} &nbsp;<span class="dim">(total alarms: ${t})</span></div>
      <div style="margin-top:12px" class="inv">YOUR SECRET EXPRESSIONS</div>
      <div class="recap">${EX.map(e => `<div><b>${e.p}</b><br>${e.d}<br><span class="ko">${e.ko}</span></div>`).join('')}</div>
      <div class="row"><span class="dim">MISSION COMPLETE. B.O.R.E.D. is offline.</span><button class="btn" id="again">PLAY AGAIN</button></div>
    </div>`;

  typeLines($('#typed'), [
    'C:\\&gt; OPEN secret_file.txt',
    '&gt; file is EMPTY...?',
    '&gt; <span class="inv">INCOMING TRANSMISSION</span> from Handler M'
  ], 450, () => {
    runCodec($('#codecSlot'), ENDING_CALL, () => {
      $('#after').style.display = 'block';
      $('#after').scrollIntoView({behavior:'smooth', block:'start'});
      $('#again').onclick = newGame;
    });
  });
}

/* =========================================================
   DEBUG MODE
   ========================================================= */
const dbg = $('#debug');
function toggleDebug(force) {
  S.debug = force !== undefined ? force : !S.debug;
  dbg.classList.toggle('show', S.debug);
  updateDebugInfo();
}
function updateDebugInfo() {
  const el = $('#dbgInfo'); if (!el) return;
  el.innerHTML = `stage: ${S.stage} · alarms: ${S.strikes}/3<br>total mistakes: ${S.total}<br>password: <span class="inv">${S.code.join('')}</span>`;
}
$('#dbgClose').onclick = () => toggleDebug(false);
dbg.addEventListener('click', ev => {
  const b = ev.target.closest('button.d'); if (!b) return;
  if (b.dataset.go !== undefined) {
    const n = Number(b.dataset.go);
    S.strikes = 0;
    if (n >= 1 && n <= 5) S.got = Math.max(S.got, n - 1);
    if (n === 6) S.got = 4;
    go(n); return;
  }
  switch (b.dataset.act) {
    case 'restart': newGame(); break;
    case 'answers':
      S.answers = !S.answers;
      document.body.classList.toggle('dbg-ans', S.answers);
      b.classList.toggle('on', S.answers);
      b.textContent = 'SHOW ANSWERS: ' + (S.answers ? 'ON' : 'OFF');
      break;
    case 'clear':
      if (S.stage >= 1 && S.stage <= 4 && overlay.classList.contains('hidden')) complete(S.stage);
      else if (S.stage === 5) go(6);
      else toast('DEBUG: nothing to clear here.');
      break;
    case 'fill':
      if (S.stage !== 4) { toast('DEBUG: go to M4 first.'); break; }
      $$('.field').forEach(f => $('input', f).value = PROMPTS[f.dataset.id].ex);
      break;
    case 'strike': strike('(debug)'); break;
    case 'reset': S.strikes = 0; S.locked = false; updateHUD(); toast('DEBUG: alarm reset.'); break;
    case 'code':
      S.code = Array.from({length:4}, () => Math.floor(Math.random() * 10));
      updateHUD(); if (S.stage === 5) go(5);
      break;
  }
});

/* ---------- global keys & buttons ---------- */
$('#fHint').onclick = toggleHint;
$('#fDebug').onclick = () => toggleDebug();
document.addEventListener('keydown', ev => {
  if (ev.key === 'F1') { ev.preventDefault(); toggleHint(); }
  if (ev.key === 'F9' || (ev.key === '`' && document.activeElement.tagName !== 'INPUT')) { ev.preventDefault(); toggleDebug(); }
});

/* ---------- START ---------- */
newGame();
if (/[?&]debug=1/.test(location.search)) toggleDebug(true);
</script>
